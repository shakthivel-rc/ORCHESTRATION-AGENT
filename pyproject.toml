[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "switchboard"
dynamic = ["version"]
description = "The bring-your-own-model decision layer: one typed route() call that picks among your tools/routes, extracts args, asks for clarification, or abstains."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "switchboard contributors" }]
keywords = ["llm", "routing", "tool-selection", "structured-output", "agents", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# The ONLY hard dependency, ever (plan §2.4, §4.8). Everything else is an extra.
dependencies = ["pydantic>=2.7,<3"]

# Optional-extras matrix — plan §10.2. Every range is upper-bounded (CVE-2026-42208 lesson, §4.8).
# Extras for v0.2+/v0.5 features are declared now (declaring an extra costs nothing); the code
# behind them lands in its tagged phase.
[project.optional-dependencies]
instructor = ["instructor>=1.7,<2"]                          # v0.1 recommended default path
litellm = ["litellm>=1.61,<2"]                               # v0.1 broadest provider matrix
otel = ["opentelemetry-api>=1.25,<2"]                        # v0.1 gen_ai.* spans (API-only dep)
openai = ["openai>=1.60,<3"]                                 # v0.2 strict Structured Outputs + logprobs
anthropic = ["anthropic>=0.40,<1"]                           # v0.2 forced tool + cache_control
gemini = ["google-genai>=1.0,<2"]                            # v0.2 responseSchema + propertyOrdering
embed = ["fastembed>=0.3,<1", "numpy>=1.24,<3"]              # v0.2 packaged embedding backends
eval = ["pyyaml>=6,<7", "rich>=13,<15"]                      # v0.2 eval CLI, gates.yaml, reports
bedrock = ["boto3>=1.34,<2"]                                 # v0.5 Bedrock Converse
distill = ["pyarrow>=15,<22"]                                # v0.5 decision-log -> training set
distill-train = ["sentence-transformers>=3,<6", "scikit-learn>=1.4,<2"]  # v0.5 classifier trainer
all = [
    "instructor>=1.7,<2",
    "litellm>=1.61,<2",
    "opentelemetry-api>=1.25,<2",
    "openai>=1.60,<3",
    "anthropic>=0.40,<1",
    "google-genai>=1.0,<2",
    "fastembed>=0.3,<1",
    "numpy>=1.24,<3",
    "pyyaml>=6,<7",
    "rich>=13,<15",
    "boto3>=1.34,<2",
    "pyarrow>=15,<22",
    "sentence-transformers>=3,<6",
    "scikit-learn>=1.4,<2",
]

[project.urls]
Homepage = "https://github.com/switchboard-dev/switchboard"
Documentation = "https://github.com/switchboard-dev/switchboard#readme"
Source = "https://github.com/switchboard-dev/switchboard"

[project.scripts]
switchboard = "switchboard.cli:main"

[tool.hatch.version]
source = "vcs"                    # git tags vX.Y.Z -> version (plan §10.1)
# This checkout is not a git repository yet, so hatch-vcs has no tag to read. The fallback keeps
# `pip install -e .` / `hatch build` working pre-tag; delete it once the repo is initialized+tagged.
fallback-version = "0.1.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard"]

[tool.hatch.build.targets.sdist]
include = ["src/switchboard", "README.md", "ORCHESTRATION_AGENT_PLAN.md"]

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TC", "RUF"]   # plan §10.1 ("TCH" is ruff's old name for "TC")

[tool.ruff.lint.isort]
known-first-party = ["switchboard"]

[tool.mypy]
strict = true                     # core must pass strict; adapters get targeted overrides below
files = ["src/switchboard"]
python_version = "3.10"
warn_unreachable = true

# Untyped third-party SDKs: relax strictness only where the optional SDKs are actually imported
# (plan §2.4 import topology). Core, engine, router, errors stay fully strict.
[[tool.mypy.overrides]]
module = [
    "switchboard.providers.instructor_adapter",
    "switchboard.providers.litellm_adapter",
    "switchboard.providers.openai_adapter",
    "switchboard.providers.anthropic_adapter",
    "switchboard.providers.gemini_adapter",
    "switchboard.providers.bedrock_adapter",
    "switchboard.telemetry.otel",
    "switchboard.shortlisters.embedding_backends",
]
disallow_untyped_calls = false
disallow_any_expr = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "instructor.*",
    "litellm.*",
    "openai.*",
    "anthropic.*",
    "google.genai.*",
    "boto3.*",
    "botocore.*",
    "opentelemetry.*",
    "fastembed.*",
    "numpy.*",
    "pyarrow.*",
    "yaml.*",
    "rich.*",
    "sentence_transformers.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-q"
